<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>疫苗教育訓練測驗</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">桃園市教育訓練</p>
        <h1>疫苗教育訓練測驗</h1>
        <p class="subtitle">單機闖關版</p>
      </div>
      <div class="meta-row" aria-label="測驗資訊">
        <span>版本 0.1.0</span>
      </div>
    </header>

    <main id="app" class="main-grid" aria-live="polite">
      <section class="panel action-panel">
        <div class="panel-copy">
          <h2>進入遊戲</h2>
          <p>輸入暱稱後開始測驗。答題期間可暫停離開，同一台瀏覽器會保留未完成進度。</p>
        </div>
        <label class="field-label" for="nicknameInput">暱稱</label>
        <input id="nicknameInput" class="text-input" maxlength="20" autocomplete="nickname" placeholder="請輸入暱稱">
        <button id="startBtn" class="primary-btn" type="button">開始測驗</button>
        <p id="startStatus" class="status-text">題庫讀取中，請稍候。</p>
      </section>

      <section class="panel action-panel">
        <div class="panel-copy">
          <h2>查看排行</h2>
          <p>排行榜只顯示前 10 名。完成測驗後也會自動顯示最新排行。</p>
        </div>
        <button id="leaderboardBtn" class="secondary-btn" type="button">查看前 10 名</button>
        <div id="homeLeaderboard" class="leaderboard compact-list"></div>
      </section>

      <section id="resumePanel" class="panel resume-panel" hidden>
        <div class="panel-copy">
          <h2>繼續未完成測驗</h2>
          <p id="resumeSummary">已找到本機暫存進度。</p>
        </div>
        <div class="resume-actions">
          <button id="resumeBtn" class="primary-btn" type="button">繼續答題</button>
          <button id="discardDraftBtn" class="secondary-btn" type="button">清除暫存</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
