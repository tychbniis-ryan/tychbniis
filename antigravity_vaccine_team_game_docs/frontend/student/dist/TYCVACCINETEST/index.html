<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TYC_VaccineTest</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">TYCVACCINETEST</p>
        <h1>疫苗教育訓練測驗</h1>
        <p class="subtitle">單機闖關版</p>
      </div>
      <div class="meta-row" aria-label="固定資訊">
        <span>TYC_VaccineTest</span>
        <span>版本 0.1.0</span>
        <span>每題 60 秒</span>
      </div>
    </header>

    <main id="app" class="main-grid" aria-live="polite">
      <section class="panel action-panel">
        <div class="panel-copy">
          <h2>進入遊戲</h2>
          <p>輸入暱稱後即可連續作答，不需要講師開關題。</p>
        </div>
        <label class="field-label" for="nicknameInput">暱稱</label>
        <input id="nicknameInput" class="text-input" maxlength="20" autocomplete="nickname" placeholder="請輸入暱稱">
        <button id="startBtn" class="primary-btn" type="button">開始測驗</button>
        <p id="startStatus" class="status-text">正在準備題庫狀態。</p>
      </section>

      <section class="panel action-panel">
        <div class="panel-copy">
          <h2>查看排行</h2>
          <p>排行榜由 GAS 回傳線上玩家前 10 名，結算後也會自動顯示。</p>
        </div>
        <button id="leaderboardBtn" class="secondary-btn" type="button">查看前 10 名</button>
        <div id="homeLeaderboard" class="leaderboard compact-list"></div>
      </section>
    </main>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
