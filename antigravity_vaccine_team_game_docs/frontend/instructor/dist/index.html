<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>疫苗守護戰隊挑戰賽｜講師端</title>
    <link rel="stylesheet" href="./styles.css?v=0.4.18">
  </head>
  <body>
    <main class="dashboard">
      <header class="topbar">
        <div>
          <p class="eyebrow">講師端</p>
          <h1>場次控制台</h1>
        </div>
        <span id="modeBadge">讀取中</span>
      </header>

      <section id="backendPanel" class="panel controls-panel">
        <h2>1. 後端設定</h2>
        <form id="backendForm" class="settings-form">
          <label>
            管理密碼
            <input id="adminSecret" name="adminSecret" type="password" autocomplete="off">
          </label>
          <button type="submit">套用設定</button>
        </form>
        <p id="backendStatus" class="status-text">正在讀取後端設定...</p>
      </section>

      <section id="startPanel" class="panel controls-panel" hidden>
        <h2>2. 啟動場次</h2>
        <dl>
          <div>
            <dt>活動</dt>
            <dd>疫苗守護戰隊挑戰賽</dd>
          </div>
          <div>
            <dt>狀態</dt>
            <dd id="gameStatus">尚未啟動</dd>
          </div>
        </dl>
        <label class="inline-toggle" id="teamChoiceStartToggle">
          <input id="allowFreeTeamChoice" type="checkbox">
          開放學員自由選隊
        </label>
        <div class="stack-actions">
          <button id="startGame" class="primary-action">啟動場次</button>
          <button id="resetGameData" type="button" class="secondary">初始化遊戲資料</button>
        </div>
      </section>

      <section id="questionPanel" class="panel controls-panel" hidden>
        <h2>3. 題目控制</h2>
        <p id="questionStatus" class="status-text">正在讀取題目清單...</p>
        <label class="single-field">
          選擇題目
          <select id="questionSelect"></select>
        </label>
        <div class="stack-actions">
          <button id="refreshQuestions" type="button" class="secondary">重新讀取題目清單</button>
          <button id="openQuestion">開放題目</button>
          <button id="closeQuestion" class="secondary">關閉題目並計分</button>
          <button id="resetGameDataInQuestion" type="button" class="secondary">初始化遊戲資料</button>
        </div>
      </section>

      <section id="answerPanel" class="panel answer-panel" aria-labelledby="answer-title" hidden>
        <h2 id="answer-title">關題公布</h2>
        <p id="answerReveal" class="answer-reveal">尚未關題。</p>
      </section>

      <section class="panel scoreboard-panel instructor-hidden-panel" hidden>
        <h2>排行榜</h2>
        <button id="refreshScoreboard" type="button" class="secondary primary-action">重新讀取排行榜</button>
        <p id="scoreboardStatus" class="status-text">尚未讀取排行榜。</p>
        <div id="scoreboardList" class="scoreboard-list"></div>
      </section>

      <section class="panel controls-panel">
        <h2>電腦學員測試</h2>
        <div class="stack-actions">
          <button id="addComputerPlayers" type="button" class="secondary">加入電腦學員</button>
          <button id="submitComputerAnswers" type="button" class="secondary">電腦作答目前題目</button>
        </div>
        <p id="computerPlayerStatus" class="status-text">需要測試時，可由講師手動加入電腦學員。</p>
      </section>

      <section class="panel controls-panel">
        <h2>結算競賽</h2>
        <button id="finalizeCompetition" type="button" class="primary-action">結算競賽</button>
        <p id="finalizeStatus" class="status-text">活動全部完成後，再執行結算。</p>
      </section>

      <section id="finalResultDialog" class="leaderboard-dialog" hidden>
        <div class="leaderboard-backdrop" data-close-final-result></div>
        <section class="panel leaderboard-panel" aria-labelledby="final-result-title" role="dialog" aria-modal="true">
          <div class="leaderboard-heading">
            <h2 id="final-result-title">競賽結算結果</h2>
            <button id="closeFinalResultDialog" type="button" class="secondary-action">關閉</button>
          </div>
          <p id="finalResultSummary" class="status-text">競賽結算後會顯示最後成績。</p>
          <div id="finalResultList" class="scoreboard-list"></div>
        </section>
      </section>

      <section class="panel controls-panel checklist-panel">
        <details>
          <summary>流程檢查</summary>
          <ul id="checklist"></ul>
        </details>
      </section>
    </main>
    <script src="./config.js?v=0.4.18"></script>
    <script src="./app.js?v=0.4.18" type="module"></script>
  </body>
</html>
