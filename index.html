<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>五子棋小遊戲</title>
    <meta name="description" content="可在 GitHub Pages 上遊玩的五子棋小遊戲。">
    <link rel="stylesheet" href="assets/css/style.css">
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <section class="game-panel">
        <div class="game-header">
          <div>
            <p class="eyebrow">Gomoku</p>
            <h1 id="game-title">五子棋小遊戲</h1>
          </div>
          <div class="turn-card" aria-live="polite">
            <span class="stone-icon black" id="turn-stone" aria-hidden="true"></span>
            <span id="turn-label">黑子先行</span>
          </div>
        </div>

        <div class="board-wrap">
          <div
            id="board"
            class="board"
            role="grid"
            aria-label="五子棋棋盤，15 乘 15"
          ></div>
        </div>

        <div class="game-actions" aria-label="遊戲操作">
          <button type="button" id="restart-button">重新開始</button>
          <button type="button" id="undo-button">悔棋</button>
        </div>
      </section>

      <aside class="score-panel" aria-label="遊戲資訊">
        <section>
          <h2>目前戰況</h2>
          <dl class="score-list">
            <div>
              <dt>黑子</dt>
              <dd id="black-count">0</dd>
            </div>
            <div>
              <dt>白子</dt>
              <dd id="white-count">0</dd>
            </div>
            <div>
              <dt>步數</dt>
              <dd id="move-count">0</dd>
            </div>
          </dl>
        </section>

        <section>
          <h2>規則</h2>
          <ol class="rule-list">
            <li>黑子先下，雙方輪流落子。</li>
            <li>橫、直、斜任一方向連成 5 顆即勝。</li>
            <li>本版本採一般簡化規則，不設定禁手。</li>
          </ol>
        </section>

        <section>
          <h2>狀態</h2>
          <p id="game-message" class="game-message">請黑子落子。</p>
        </section>
      </aside>
    </main>

    <script src="assets/js/main.js"></script>
  </body>
</html>
